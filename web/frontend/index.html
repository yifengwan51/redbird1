<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>MoTrack 篮球智能分析</title><style>
:root{--bg:#07111f;--panel:#10243d;--line:#234567;--blue:#2a9cff;--ink:#edf5ff;--muted:#9db4ce;--amber:#f8c552;--green:#4ee0a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#15345a 0,var(--bg) 38%);color:var(--ink);font:14px system-ui,Segoe UI,sans-serif}header{padding:18px 5%;display:flex;gap:18px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#091827e8;position:sticky;top:0;z-index:3}main{max-width:1380px;margin:auto;padding:22px}.title{font-size:20px;letter-spacing:.4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.below{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.card{background:linear-gradient(145deg,#112943,#0d1d31);border:1px solid var(--line);box-shadow:0 14px 40px #0003;border-radius:14px;padding:17px;margin-bottom:18px}h2,h3{margin:0 0 13px}video{width:100%;background:#000;border-radius:10px;aspect-ratio:16/9}button,select,input{border:1px solid #3a638c;border-radius:8px;padding:9px 11px;background:#0c1b2f;color:var(--ink);font:inherit}button{cursor:pointer;background:#197fd9;border:0;font-weight:650}button:hover{background:#299cff}.event{padding:11px;border-left:4px solid var(--amber);margin:7px 0;background:#09192b;border-radius:0 9px 9px 0;cursor:pointer}.event:hover{background:#102b47}.muted{color:var(--muted)}.pill{display:inline-block;border:1px solid #31597d;padding:3px 7px;border-radius:999px;font-size:12px;color:#b8d5ef}pre{margin:0;white-space:pre-wrap;max-height:240px;overflow:auto;color:#c7d8eb}.chatlog{height:190px;overflow:auto;background:#081727;border-radius:8px;padding:10px}.chatline{padding:5px 0;border-bottom:1px solid #193452}.chatrow{display:flex;gap:8px;margin-top:9px}.chatrow input{flex:1}.settings{display:flex;flex-wrap:wrap;gap:9px;align-items:center}@media(max-width:820px){.grid,.below{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style><body><header><div><b class="title">MoTrack</b><span class="muted"> · 篮球高光与比赛复盘</span></div><div><span class="pill" id="modeLabel">加载模式…</span> <span class="muted" id="status">初始化中…</span></div></header><main>
<section class="card"><div class="settings"><b>视频与模式</b><select id="video"><option value="cbf">ČBF 3x3 Tour</option><option value="doug">Doug McDermott</option></select><select id="mode"><option value="llm">LLM Agent（DeepSeek）</option><option value="lightweight">Lightweight Agent（本地 X3D）</option></select><label id="variantWrap">候选对照 <select id="variant"><option value="v1">Lightweight V1</option><option value="v2">Lightweight V2（保守审计）</option><option value="hypecut">HypeCut-only</option></select></label><span class="muted" id="modeHint"></span></div></section>
<section class="grid"><div class="card"><h3>原始篮球比赛</h3><video id="source" controls></video></div><div class="card"><h3>高光集锦 <a id="download" class="muted" href="/api/v1/media/highlight/highlights.mp4" download>下载 MP4</a></h3><video id="highlight" controls src="/api/v1/media/highlight/highlights.mp4"></video></div></section>
<section class="below"><div class="card"><h3>篮球事件时间轴</h3><p class="muted" id="eventNote">读取中…</p><div id="events"></div></div><div><section class="card"><h3>高光剪辑设置</h3><div class="settings"><label>时长 <input id="duration" type="number" value="15" min="5" max="60" style="width:78px"> 秒</label><label>事件 <select id="eventType"><option value="shot_attempt">疑似投篮</option><option value="all">全部本地候选</option></select></label><button id="generateButton" onclick="make()">生成高光</button></div><p class="muted">LLM 默认使用已缓存视觉结果；Lightweight 仅使用项目本地 X3D，完全不调用 HTADC。</p></section><section class="card"><h3>智能复盘</h3><pre id="recap"></pre></section></div></section>
<details class="card" open><summary><b>高光候选分析</b> <span class="muted">点击候选可跳转原视频；数据来自当前版本 JSON</span></summary><div id="candidates" class="muted" style="margin-top:10px">加载中…</div></details>
<section class="card"><h3>Agent 对话</h3><div class="chatlog" id="chat"><div class="muted">选择 Lightweight 后可使用确定性命令：生成投篮高光、找出疑似投篮、缩短到15秒、解释这段视频、查看关键事件、导出视频。</div></div><div class="chatrow"><input id="msg" placeholder="例如：生成投篮高光"><button onclick="send()">发送</button></div></section>
<details class="card"><summary>运行信息 / 工具轨迹</summary><pre id="run"></pre></details></main><script>
const $=x=>document.querySelector(x);let ev=[],sessionId='',busy=false,loadRevision=0;
const safe=t=>String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function sourceName(id){return id==='cbf'?'cbf_3x3_tour.mp4':'doug_mcdermott.mp4'}
function artifactUrl(path,version){const url=new URL('/api/v1/artifact',window.location.origin);url.searchParams.set('path',path);if(version!==undefined)url.searchParams.set('v',String(version));return url.toString()}
function versionedUrl(urlLike,version=Date.now()){const url=new URL(urlLike,window.location.origin);url.searchParams.set('v',String(version));return url.toString()}
function setBusy(value,label){busy=value;$('#generateButton').disabled=value;$('#generateButton').textContent=value?'处理中…':'生成高光';if(label)$('#status').textContent=label}
function activeVariant(){return $('#mode').value==='lightweight'?$('#variant').value:'v1'}
function resetOutput(){const id=$('#video').value,mode=$('#mode').value;if(id==='cbf'&&mode==='llm'){const u=versionedUrl('/api/v1/media/highlight/highlights.mp4');$('#highlight').src=u;$('#download').href=u}else{$('#highlight').removeAttribute('src');$('#highlight').load();$('#download').removeAttribute('href')}}
async function readJson(response){const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||data));return data}
async function load(){const revision=++loadRevision;const stale=()=>revision!==loadRevision;try{let id=$('#video').value,mode=$('#mode').value,variant=activeVariant(),caps=await fetch('/api/v1/capabilities').then(readJson);if(stale())return;$('#variantWrap').style.display=mode==='lightweight'?'inline':'none';$('#source').src=versionedUrl('/api/v1/media/source/'+sourceName(id));$('#modeLabel').textContent=mode==='lightweight'?'当前：Lightweight Agent':'当前：LLM Agent';$('#modeHint').textContent=mode==='lightweight'?`X3D-XS 本地 CUDA/CPU 推理；候选版本 ${variant}；无云端 Token。`:'缓存视觉模式；仅发送聊天才会触发 HTADC。';let data=await fetch(`/api/v1/videos/${id}/events?mode=${mode}&variant=${variant}`).then(readJson);if(stale())return;ev=data.events||[];$('#events').innerHTML=ev.map(e=>`<div class="event" onclick="jump(${Number(e.start_time)})"><b>${safe(e.event_type)}</b> · ${Number(e.start_time).toFixed(1)}–${Number(e.end_time).toFixed(1)}s<br><span class="muted">${e.raw_model_score!==undefined?'原始 X3D 分数 '+e.raw_model_score:'综合分 '+(e.final_ranking_score??e.confidence)} · ${safe(e.verification_status||'MODEL_PREDICTED')}</span></div>`).join('')||'<p class="muted">暂无候选。</p>';$('#eventNote').textContent=`${mode}/${mode==='lightweight'?variant:'cached'}：${ev.length} 条事件；未人工确认的事件不代表比赛事实。`;$('#candidates').innerHTML=ev.map((e,i)=>{let score=e.final_ranking_score??e.raw_model_score??e.confidence??'—',x3d=e.shooting_basketball_softmax??e.visual_score??e.raw_model_score??'—',h=e.hypecut_score??e.hypecut_signal?.segment_score??'—';return `<div class="event" onclick="jump(${Number(e.start_time)})"><b>#${i+1} ${safe(e.event_id||'candidate')}</b> · ${Number(e.start_time).toFixed(1)}–${Number(e.end_time).toFixed(1)}s · ${safe(e.event_type)}<br><span class="muted">X3D ${x3d} · HypeCut ${h} · 综合 ${score} · ${safe(e.verification_status||'MODEL_PREDICTED')} · ${e.source_window_ids?('来源窗口 '+e.source_window_ids.join(', ')):''}</span></div>`}).join('')||'<p>当前版本没有候选。</p>';const recap=await fetch('/api/v1/videos/'+id+'/recap').then(readJson);if(stale())return;$('#recap').textContent=JSON.stringify(recap,null,2);$('#run').textContent=JSON.stringify(caps,null,2);$('#status').textContent='本地页面就绪'}catch(error){if(!stale())$('#status').textContent='加载失败：'+error.message}}
function jump(t){$('#source').currentTime=t;$('#source').play()}
function adopt(out){if(!out)return;const path=out.path||out.video;if(!path)return;const url=path.startsWith('/')?versionedUrl(path):artifactUrl(path,Date.now());$('#highlight').src=url;$('#highlight').load();$('#download').href=path.startsWith('/')?path:artifactUrl(path);$('#highlight').play().catch(()=>{})}
async function pollJob(id){for(let i=0;i<180;i++){const job=await fetch('/api/v1/jobs/'+id).then(readJson);$('#status').textContent=`任务 ${id}：${job.stage||job.status}`;$('#run').textContent=JSON.stringify(job,null,2);if(job.status==='completed')return job;if(job.status==='failed')throw new Error(job.error?.message||job.error?.error_type||'本地任务失败');await new Promise(r=>setTimeout(r,500))}throw new Error('等待任务超时，请查看运行详情')}
async function make(){if(busy)return;try{const mode=$('#mode').value;setBusy(true,'已提交任务…');const body={video_id:$('#video').value,mode,candidate_version:activeVariant(),target_duration:+$('#duration').value,event_types:$('#eventType').value==='all'?['basketball_action_candidate','shot_attempt']:['shot_attempt']};const submitted=await fetch('/api/v1/highlights',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(readJson);if(submitted.session_id)sessionId=submitted.session_id;const job=await pollJob(submitted.id);if(job.result?.session_id)sessionId=job.result.session_id;adopt(job.result?.output||job.result);$('#run').textContent=JSON.stringify(job.result||job,null,2);$('#status').textContent='任务完成：MP4 已通过验证'}catch(error){$('#status').textContent='生成失败：'+error.message}finally{setBusy(false)}}
async function send(){if(busy)return;const t=$('#msg').value.trim();if(!t)return;try{setBusy(true,'Agent 处理中…');const mode=$('#mode').value,r=await fetch('/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,session_id:sessionId||undefined,video_id:$('#video').value,mode,candidate_version:activeVariant()})}).then(readJson);$('#chat').innerHTML+=`<div class="chatline"><b>你：</b>${safe(t)}<br><b>Agent：</b>${safe(r.reply||'请求完成')}</div>`;$('#chat').scrollTop=$('#chat').scrollHeight;$('#msg').value='';if(r.session_id)sessionId=r.session_id;adopt(r.output);$('#run').textContent=JSON.stringify(r,null,2);$('#status').textContent=r.failure?'执行失败：'+(r.failure.error_type||r.failure.stage):r.state||'完成'}catch(error){$('#chat').innerHTML+=`<div class="chatline"><b>系统：</b>${safe(error.message)}</div>`;$('#status').textContent='Agent 失败：'+error.message}finally{setBusy(false)}}
$('#video').onchange=()=>{sessionId='';resetOutput();load()};$('#mode').onchange=()=>{sessionId='';resetOutput();load()};$('#variant').onchange=()=>{sessionId='';resetOutput();load()};load();
</script></body></html>
